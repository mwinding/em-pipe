# Talk movie (Oct 2026) from the complete 35h volume as first rendered (unrotated, contrast before
# the shading/overlap work): the whole slice, a zoom into the neuropil spot of the first 2-day test
# movie (mapped with tools/map_point.py), a hold at full resolution, then the zoom back out: once the
# frame is ~90 um wide (zoom 6) the image turns face-on by 90 degrees about the frame's vertical centre
# line to the side view while the zoom-out carries on, until the whole side of the brain (y by z,
# 141 um deep) is in frame. 22.5 s; the scroll carries on throughout.
#   sbatch --output=<output_dir>/work/logs/em-movie-%j.out slurm/movie.sbatch configs/P667_EM05024_35h_movie.yaml
# -> <output_dir>/P667_EM05024_35h_side_movie.mp4
base: P667_EM05024_35h.yaml

movie:
  volume: P667_EM05024_35h.ome.zarr
  name: P667_EM05024_35h_side_movie
  target: [6720, 10336, 8936]  # = 2-day test volume [6720, 9920, 1010] (2 Oct 16:04)
  view_rotation_deg: 180       # the brain the way up we show it
  slices_per_s: [120, 60]      # zoomed out -> zoomed in
  hold_start_s: 1.5
  zoom_s: 9.0
  hold_end_s: 2.0
  rotate_deg: 90               # turn to the side view (y-z plane)
  rotate_style: plane          # face-on (the 3D block turn, block, was dropped)
  rotate_start_zoom: 6.0       # turn during the zoom-out, once the frame is ~90 um wide (structure reads)
  rotate_s: 2.5                # ends at zoom ~22, just before the zoom-out does
  zoom_out_s: 7.0              # out to the whole side view
  hold_out_s: 3.0
