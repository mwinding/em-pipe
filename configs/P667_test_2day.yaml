# P667 EM05024 35h, 1-2 October 2026 only (~1,200 slices) at 32 nm: a quick first look at the whole
# pipeline before running configs/P667_EM05024_35h.yaml. check still reads every raw header.
#   ./run_pipeline.sh configs/P667_test_2day.yaml

name: P667_M10-D01-D02   # -> P667_M10-D01-D02.ome.zarr and P667_M10-D01-D02_<voxel>nm.tif
raw_dir: /camp/project/proj-efibsem/WindingM/P667_EM05024_35h
output_dir: /camp/lab/windingm/home/users/windinm/em-pipe_P667_test-M10-D01-D02

selection:
  start: '2026-10-01 00:00:00'
  end: '2026-10-02 23:59:59'

check:
  voxel_size_nm: [8, 8, 8]
  known_issues:
    - file: M09_D28_tile0-1.tif
      action: exclude
      note: byte copy of M09_D28_tile1-0.tif
    - file: Approach/M09_D18_tile2-1_part2.tif
      action: exclude
      note: byte copy of M09_D18_tile2-2_part2.tif

# Tile overlap is unknown: search it at 1/4 resolution (8 is the default; ~1% overlaps on noisy
# tiles can need more). Failed slices are retried at higher resolution anyway.
stitch:
  coarse_factor: 4

# No curtaining removal: destreak (sigma 4) added bright lines ~500 px inside tile edges and smeared
# strong raw lines, worse for tracing than the mild (~2 grey level) curtaining it removed.
destreak:
  enabled: false

render:
  downsample: 4              # 32 nm voxels

slurm:
  mail_user: null            # your email, for failure mails
  # Short single jobs: small requests so they start quickly between the array jobs.
  check: {cpus: 4, mem: 4G, time: "01:00:00"}
  preview: {array: 10, cpus: 2, mem: 8G, time: "02:00:00"}       # 25 chunks of 50 slices
  preview_merge: {cpus: 2, mem: 4G, time: "00:30:00"}
  stitch: {array: 5, cpus: 8, mem: 8G, time: "02:00:00"}         # 28 sampled slices
  stitch_merge: {cpus: 2, mem: 4G, time: "00:30:00"}
  align: {array: 13, cpus: 8, mem: 16G, time: "04:00:00"}        # 13 chunks of 100 slices
  align_solve: {cpus: 2, mem: 8G, time: "00:30:00"}
  intensity: {cpus: 2, mem: 8G, time: "00:30:00"}
  zcorrect: {array: 6}
  render_init: {cpus: 2, mem: 8G, time: "00:30:00"}
  render: {array: 5, cpus: 8, mem: 64G, time: "04:00:00"}        # ~303 planes at f=4: 5 slabs
  pyramid: {array: 5, cpus: 2, mem: 8G, time: "01:00:00"}
