# P667 EM05024 35h, 10-12 October 2026 (~2,200 slices) at 32 nm: stitching of the last, smaller 2x2
# tiles (11126 x 12250, then 10251 x 11625, then 9001 x 10375 px) and the changes between them.
# Same settings as configs/P667_test_2day.yaml (the 2x2 test). check still reads every raw header.
#   ./run_pipeline.sh configs/P667_test_small_tiles.yaml

name: P667_M10-D10-D12   # -> P667_M10-D10-D12.ome.zarr and P667_M10-D10-D12_<voxel>nm.tif
raw_dir: /camp/project/proj-efibsem/WindingM/P667_EM05024_35h
output_dir: /camp/lab/windingm/home/users/windinm/em-pipe_P667_test-M10-D10-D12

selection:
  start: '2026-10-10 00:00:00'
  end: '2026-10-12 23:59:59'

check:
  voxel_size_nm: [8, 8, 8]
  # M09_D28_tile0-1.tif and Approach/M09_D18_tile2-1_part2.tif were copies of other tiles until they
  # were re-exported (by 14 Oct 2026); check flags any copy (DUPLICATE_CONTENT).
  known_issues: []

# Tile overlap is unknown: search it at 1/4 resolution (8 is the default; ~1% overlaps on noisy
# tiles can need more). Failed slices are retried at higher resolution anyway.
stitch:
  coarse_factor: 4

# No curtaining removal: destreak (sigma 4) added bright lines ~500 px inside tile edges and smeared
# strong raw lines, worse for tracing than the mild (~2 grey level) curtaining it removed.
destreak:
  enabled: false

render:
  downsample: 4              # 32 nm voxels

slurm:
  mail_user: null            # your email, for failure mails
  # Short single jobs: small requests so they start quickly between the array jobs.
  check: {cpus: 4, mem: 4G, time: "01:00:00"}
  preview: {array: 15, cpus: 2, mem: 8G, time: "02:00:00"}       # 45 chunks of 50 slices
  preview_merge: {cpus: 2, mem: 4G, time: "00:30:00"}
  stitch: {array: 8, cpus: 8, mem: 16G, time: "02:00:00"}        # ~55 sampled slices
  stitch_merge: {cpus: 2, mem: 4G, time: "00:30:00"}
  align: {array: 23, cpus: 8, mem: 16G, time: "04:00:00"}        # 23 chunks of 100 slices
  align_solve: {cpus: 2, mem: 8G, time: "00:30:00"}
  intensity: {cpus: 2, mem: 8G, time: "00:30:00"}
  zcorrect: {array: 6}
  render_init: {cpus: 2, mem: 8G, time: "00:30:00"}
  render: {array: 9, cpus: 8, mem: 64G, time: "04:00:00"}        # ~554 planes at f=4: 9 slabs
  pyramid: {array: 9, cpus: 2, mem: 8G, time: "01:00:00"}
