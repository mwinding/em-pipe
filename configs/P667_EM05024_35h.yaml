# P667 EM05024 35h: the whole acquisition, 17 Sep - 14 Oct 2026 (~15,700 slices exported up to 12 Oct,
# ~17,000 in all; ~21 TB). 3x3 tiles of ~8700 x 8900 px (17-23 Sep, in Approach/), then 2x2 tiles of
# 12751 x 13875 px, shrinking in steps from 8 Oct to 9001 x 10375 px: 6 tile layouts, 8 nm voxels.
# Settings not listed here use the defaults in configs/example.yaml.
#   ./run_pipeline.sh configs/P667_EM05024_35h.yaml --dry-run    # check the job chain first

name: P667_EM05024_35h
raw_dir: /camp/project/proj-efibsem/WindingM/P667_EM05024_35h
output_dir: /camp/lab/windingm/home/shared/electron_microscopy/35_h/P667_EM05024_35h_stitched

check:
  voxel_size_nm: [8, 8, 8]
  # Acquisition ended before the clocks went back (2026-10-25), so local label times are monotonic.
  timezone: null
  # M09_D28_tile0-1.tif and Approach/M09_D18_tile2-1_part2.tif were copies of other tiles until they
  # were re-exported (by 14 Oct 2026); check flags any copy (DUPLICATE_CONTENT).
  known_issues: []

# Tile-level affine solve (pipeline/tilesolve.py) on the stretches flagged by rejected align pairs or
# tile jumps > 15 px (qc/spots, 15 Oct 2026), except those at tile layout changes (frame fit / elastic).
align:
  local_windows: [[113, 134], [621, 638], [677, 693], [1052, 1070], [1077, 1094], [2233, 2249], [2390, 2406], [3366, 3386], [3399, 3418], [3520, 3547], [4567, 4583], [6470, 6486], [6769, 6789], [8020, 8048], [10871, 10889], [11219, 11235], [11356, 11393], [11471, 11487], [13669, 13686], [13693, 13710], [15068, 15111], [15245, 15257], [15265, 15296], [15302, 15318]]

# Display windows from the tissue only (background masked), its 1st-99th percentiles -> 0-255: chosen by
# eye (16 Oct 2026) over median-anchored and the old all-pixel 0.5-99.5 % windows, which stepped by
# ~40 greys at the tile layout changes (qc/normalisation_compare.tif).
intensity:
  window: percentile
  percentile_of: tissue
  lo_percentile: 1
  hi_percentile: 99

# Tile overlap search at 1/4 resolution: more margin than the default 8 for small (~1%) overlaps.
stitch:
  coarse_factor: 4

# Tune on a few slices before enabling: python -m pipeline.destreak test --config C --z Z --tile 0-0
destreak:
  enabled: false

zcorrect:
  enabled: false

render:
  blend: cut                 # one tile per pixel, no transition (Zetta: no blending)
  clahe:
    enabled: false           # the main volume; a CLAHE version is derived from it
  downsample: 1

# ~17,000 slices of ~1.4 GB (4 or 9 tiles). Arrays are task counts; chunks are spread over the tasks.
slurm:
  mail_user: null            # your email, for failure mails
  check: {cpus: 4, mem: 16G, time: "02:00:00"}
  preview: {array: 40, cpus: 2, mem: 8G, time: "04:00:00"}        # ~340 chunks of 50 slices (~70 GB read each)
  preview_merge: {cpus: 2, mem: 16G, time: "01:00:00"}
  stitch: {array: 30, cpus: 8, mem: 16G, time: "04:00:00"}       # ~350 sampled slices + refinement (~20 s each)
  stitch_merge: {cpus: 2, mem: 8G, time: "01:00:00"}
  align: {array: 40, cpus: 8, mem: 16G, time: "12:00:00"}         # ~170 chunks of 100 slices, ~30 min each
  align_solve: {cpus: 4, mem: 32G, time: "02:00:00"}
  intensity: {cpus: 2, mem: 16G, time: "01:00:00"}
  zcorrect: {array: 20, cpus: 2, mem: 8G, time: "04:00:00"}
  zcorrect_solve: {cpus: 2, mem: 8G, time: "01:00:00"}
  render_init: {cpus: 2, mem: 16G, time: "01:00:00"}
  render: {array: 30, cpus: 8, mem: 160G, time: "24:00:00"}       # ~265 slabs of 64 planes, 5-10 min each
  pyramid: {array: 20, cpus: 4, mem: 8G, time: "06:00:00"}        # s1: ~16k shards of ~0.5 s
