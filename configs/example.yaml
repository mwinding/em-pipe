# em-pipe dataset config: every section and key with its default value.
# A dataset config only needs raw_dir and output_dir plus the keys it changes; everything else
# falls back to these defaults (defined in pipeline/config.py and each pipeline/<step>.py).
# Run everything on Slurm:  ./run_pipeline.sh configs/<dataset>.yaml [--dry-run]

name: null                   # dataset name: names the volume (<name>.ome.zarr), titles and OME-Zarr metadata
raw_dir: /path/to/raw        # folder of daily ImageJ TIFF exports (searched recursively); never written to
# output_dir holds the volume, a quick-look TIFF and qc/ (report, plots); working files go to work/
output_dir: /path/to/output

raw:
  # Daily export files, e.g. M10_D06_tile1-1.tif or M09_D23_tile0-0_part2.tif. Groups: month, day, row, col,
  # optional part (default 1); a file whose name has no row/col takes its tile from its slice labels.
  file_pattern: '^M(?P<month>\d{2})_D(?P<day>\d{2})_tile(?P<row>\d+)-(?P<col>\d+)(?:_part(?P<part>\d+))?\.tif$'
  # Per-slice ImageJ labels, e.g. G460-0186_26-10-06_000146_0-1-1_InLens_raw.tif
  label_pattern: '^(?P<instrument>.+?)_(?P<date>\d{2}-\d{2}-\d{2})_(?P<time>\d{6})_(?P<group>\d+)-(?P<row>\d+)-(?P<col>\d+)_(?P<detector>[^_]+)_raw\.tif$'
  label_time_format: '%y-%m-%d_%H%M%S'   # applied to "{date}_{time}" from the label pattern
  recursive: true                        # also search subfolders of raw_dir

# Restricts every step after check. Keys: start, end (timestamps, inclusive, e.g. '2026-10-01 00:00:00'),
# z_start, z_end (global slice index, inclusive). Empty: everything.
selection: {}

check:
  voxel_size_nm: null        # expected voxel size in nm (number, or [x, y, z]); files off by >1% get a WARN. null: no check
  gap_factor: 1.5            # TIME_GAP when the interval between slices exceeds gap_factor x the segment's median interval
  min_age_minutes: 60        # files modified more recently are still being written/copied: pending, not read
  hash_bytes: 1048576        # bytes hashed from the middle of slices 0, n/2, n-1 to detect copied tiles (max half a slice)
  threads: 8                 # parallel header reads (latency bound on network storage)
  # Time zone of the label clock, e.g. Europe/London: label times are converted to UTC so slices stay in
  # order when the clocks go back (selection start/end stay local). null: times as written
  timezone: null
  # Acknowledged problems: [{file, note, action: exclude|ignore}]; exclude drops the file's slices.
  # file is the path relative to raw_dir or just the file name.
  known_issues: []

preview:
  factor: 16                 # downsampling factor (area average) for stats and thumbnails
  chunk_slices: 50           # z per array-task chunk (fixed blocks of global z, split at segment changes)
  sheet_slices: 6            # evenly spaced slices shown on each daily contact sheet
  edge_margin_px: 0          # stats ignore this many full-res px at tile edges (e.g. dark off-sample bands)

stitch:
  sample_every: 50           # stitch every n-th selected z of a segment (plus its ends and seams)
  refine_px: 5.0             # stitch more slices between two samples whose tiles differ by more than
                             # this (px at a tile corner), down to adjacent slices; null = off
  coarse_factor: 8           # downsampling of whole tiles for the overlap search
  min_coarse_factor: 2       # if tiles stay unconnected, retry the search at half the factor down to this
  fine_factor: 2             # downsampling of the full-res overlap strips for the final matches
  fine_margin_px: 200        # full-res margin added around the coarse overlap for fine matching
  # affine_rigid: Janelia's montage model (mpicbg/TrakEM2/render), an affine per tile regularised
  # toward rigid; also translation | rigid | similarity | affine
  model: affine_rigid
  rigid_lambda: 0.1          # affine_rigid: weight of the rigid pull (1 ~ rigid, 0 = free affine)
  max_pair_rms_px: 10.0      # non-translation models: reject a slice if a pair's rms after the joint solve exceeds this
  mode: auto                 # fixed (one transform per tile and segment) | per_slice | auto
  fixed_tolerance_px: 2.0    # auto -> fixed if no tile's sampled offset is further than this from its median
  ratio: 0.8                 # Lowe ratio test
  ransac_px: 3.0             # RANSAC inlier distance, in pixels of the image being matched
  min_inliers: 12            # fewer RANSAC inliers -> pair rejected
  max_points_per_pair: 200   # inlier correspondences per pair used in the solve
  max_features: 20000        # SIFT keypoints kept per image (strongest)

align:
  scale: 0.25                # detect features on tiles downsampled to this fraction
  neighbors: 4               # match each slice to this many following selected slices
  chunk_slices: 100          # global z per array-task chunk (bounds at multiples of this)
  max_features: 8000         # SIFT features per tile (at the detection scale)
  ratio: 0.8                 # Lowe ratio test
  ransac_model: rigid        # translation | rigid | similarity | affine, per tile pair
  ransac_px: 2.0             # RANSAC inlier threshold in detection-scale pixels
  min_inliers: 12            # tile pairs with fewer RANSAC inliers are dropped
  max_points_per_pair: 100   # inliers kept per (slice pair, tile), spread over the tile
  model: translation         # per-slice transform: translation | affine
  affine_regularization: 0.1 # affine: pull of the linear part toward identity, relative to the data
  robust_iterations: 3       # rounds of outlier rejection + re-solve
  reject_px: 4.0             # never reject points whose residual is below this (full-res px)
  segment_change_model: affine  # none | translation | similarity | affine: fitted between the montage
                             # frames either side of each tile layout change (align/segment_changes.csv)
  segment_reference: largest # largest | first: segment whose montage frame the volume keeps
  local_at_layout_changes: false # tile-level affine solve in a window around every tile layout change
  local_half_width: 50       # slices either side of a layout change
  local_windows: []          # more windows for the tile-level solve, [[z_first, z_last], ...]
  local_regularization: 0.001  # pull of each tile toward its global solution, relative to its data
  local_seam_weight: 64.0    # weight of a seam point relative to a match across slices (higher: seams move less)
  elastic_min_px: 5.0        # smooth (elastic) correction at layout changes whose frame fit leaves a median
                             # mismatch above this (null: none); see pipeline/elastic.py
  elastic_interfaces: []     # more interfaces to correct: the first z after each
  elastic_side: before       # before | after: the side warped into the other's geometry (up to the previous /
                             # next corrected interface, across other layout changes)
  elastic_grid_px: 1000      # spacing of the field's grid, full-res px
  elastic_smoothness: 0.3    # penalty on differences between neighbouring grid values
  anchor: first              # first (first selected slice = identity) | mean (mean translation 0)
  remove_trend: none         # none | linear | lowpass: remove slow drift (steps at seams are kept)
  trend_window_slices: 2000  # lowpass: Gaussian FWHM in slices

intensity:
  window: median             # median: tissue median -> target_median, tissue p5-p95 over target_span greys
                             # (background left out) | percentile: lo/hi_percentile -> 0 / 255
  target_median: 140         # median: grey of the tissue median (0-255)
  target_span: 160           # median: greys between the tissue p5 and p95
  lo_percentile: 0.5         # percentile: preview percentile rendered as 0 (all: 0.5, 1, 50, 99, 99.5;
                             # tissue: 1, 5, 25, 50, 75, 95, 99)
  hi_percentile: 99.5        # percentile: preview percentile rendered as 255
  percentile_of: all         # percentile: of all pixels, or of the tissue only (background left out)
  smooth_slices: 51          # running-median window over z, in selected slices
  break_at_seams: true       # restart smoothing at seams (it always restarts at segment changes)
  balance_tiles: true        # match brightness of overlapping tiles (needs stitch/tiles.csv)
  balance_source: thumbnails # thumbnails: preview thumbnails every balance_every slices | overlaps: the overlaps step
  balance_every: 10          # thumbnails: measure tile overlaps every N selected slices
  balance_tissue_only: true  # thumbnails: compare overlaps on tissue pixels only (background left out)
  balance_smooth_slices: null  # running median of tile gains/offsets over this many slices; null: smooth_slices
  per_slice: true            # follow slice-to-slice jumps: true per tile | slice: one per slice (keeps tiles matched) | false

shading:                     # flat-field: a smooth gain field per tile position and segment, from the thumbnails
  enabled: false             # runs in the intensity job; render divides each tile slice by its field
  every: 10                  # measure every N-th selected slice
  poly_degree: 2             # 2D polynomial fitted to log(brightness / tissue median)
  min_slices: 10             # (segment, tile) measured in fewer slices keep gain 1
  min_count: 5               # pixels measured in fewer slices than this don't enter the fit
  resin_weight: 0.3          # plain bright resin (scaled to its own median) enters the fit at this weight vs tissue (0: tissue only)
  prior_weight: 0.2          # pull towards gain 1 (per pixel, in slices): the field relaxes to 1 where little tissue was measured
  max_gain: 1.5              # fields are clipped to [1 / max_gain, max_gain]

overlaps:                    # brightness relation of every overlapping tile pair, from the raw tiles
  enabled: false             # run_pipeline.sh: measure after align (for intensity.balance_source: overlaps)
  every: 1                   # measure every N-th selected slice
  factor: 4                  # area-downsampling of the overlaps before matching (4: 32 nm at 8 nm pixels)
  trim_px: 16                # full-resolution px left out at each tile's border (scan edge effects)
  smooth_px: 1.0             # Gaussian sigma (downsampled px) applied to both tiles' overlap
  min_pixels: 500            # pixel pairs (downsampled) a relation needs
  reject: 3.0                # pairs further than this many robust sigmas off the line are dropped
  chunk_slices: 100          # selected z per array-task chunk (fixed blocks of global z)

# Curtaining removal inside render. Tune first: python -m pipeline.destreak test --config C --z Z --tile r-c
destreak:
  enabled: false             # apply inside render
  direction: vertical        # stripes run along y (vertical) or along x (horizontal)
  wavelet: db4               # pywt wavelet name
  levels: 6                  # wavelet decomposition levels (capped by the image size)
  sigma: 4.0                 # width of the Gaussian notch in FFT bins; larger removes more

zcorrect:
  enabled: false             # run zcorrect and let render use positions.csv
  chunk_slices: 200          # selected slices per array chunk in `run`
  max_distance: 8            # compare each slice with its next N selected slices
  crop_px: 1024              # square crop per tile (full-resolution px), centred on the tile
  factor: 1                  # downsample crops before NCC
  iterations: 3              # solve: re-estimate f(d) from positions and re-solve
  regularization: 0.1        # pull of each spacing toward nominal, relative to one adjacent-pair NCC
  min_spacing_fraction: 0.25 # minimum spacing as a fraction of nominal
  # Hold the rolling mean spacing over this many slices at nominal, so slow changes in image texture
  # are not read as thickness drift (0: only per block between seams)
  nominal_window: 200

# render writes scale 0; pyramid builds scales 1..num_scales-1 from it.
render:
  name: null                 # volume folder in output_dir; null: <name>.ome.zarr
  downsample: 1              # integer binning factor f in x, y and z (1 = full resolution)
  bbox: null                 # [xmin, ymin, xmax, ymax] in aligned px to render a region; null = all
  rotate_deg: 0              # 180: the volume rotated in x-y about the canvas centre (not mirrored)
  integer_shifts: true       # round translation-only transforms to whole px (no interpolation blur)
  # Grey levels: true uses intensity/levels.csv (per-tile windows, balanced, smoothed, per-slice);
  # false maps every tile slice through one fixed raw window, so the raw tile/slice differences show.
  intensity: true
  window: null               # [lo, hi] raw values for intensity false; null: from preview stats (p1 of p0.5, p99 of p99.5)
  # How overlapping tiles combine. seam: each pixel from the tile whose own edge is farthest, switching
  # along the middle of the overlap over ~seam_px (sharp; no ghosting where tiles disagree by a few px).
  # cut: the same switch with no transition at all. feather: linear crossfade over blend_px from each tile edge.
  blend: seam
  local_blend: cut           # blend in slices of align's tile-level solve and elastic windows
  seam_px: 32                # seam: width of the switch between tiles, full-resolution px
  blend_px: 256              # feather: ramp width from each tile edge, full-resolution px
  slab: 64                   # planes per run work unit = shard z size
  chunk: [64, 64, 64]        # inner chunk (z, y, x) that neuroglancer fetches
  shard_xy: 1024             # shard size in y and x
  num_scales: 7              # pyramid levels s0..s{n-1}; render writes s0, pyramid the rest
  compression: gzip          # none | gzip | zstd | blosc; gzip is safe for neuroglancer
  clahe:
    enabled: true            # local contrast equalisation of each output plane
    clip_limit: 2.0          # cv2 CLAHE clip limit
    tile_px: 512             # CLAHE tile size in full-resolution px
  threads: 8                 # tiles rendered concurrently (does not change the output)

pyramid: {}                  # no settings: scales, chunks and shards are fixed by render init

export:
  max_gb: 4.0                # quick-look TIFF from the finest scale up to this size (uint8, uncompressed)

serve:
  port: 8000                 # HTTP port (--port overrides)
  bind: 127.0.0.1            # listen address (--bind overrides); 0.0.0.0 to tunnel via the login host

# Slurm settings per job for run_pipeline.sh: array (number of tasks), cpus, mem, time (a quoted
# string, e.g. "04:00:00"), partition, gres. Unset keys keep the #SBATCH defaults of slurm/<step>.sbatch.
# Jobs: check, preview, preview_merge, stitch, stitch_merge, align, align_solve, intensity, zcorrect,
# zcorrect_solve, render_init, render, pyramid (one job per scale, each with this array size), export.
precomputed:
  enabled: false             # run_pipeline.sh: Neuroglancer precomputed export after pyramid
  name: null                 # folder in output_dir; null: <volume stem>.precomputed
  chunk: [128, 128, 128]     # chunk size, x y z voxels
  encoding: raw              # raw (lossless, gzip in the shards) | jpeg (lossy, smaller)
  jpeg_quality: 90
  sharded: true
  shard_chunks_log2: 6       # chunks per shard = 2^this (6: 4 x 4 x 4)
  minishard_chunks_log2: 3   # chunks per minishard = 2^this
  scales: null               # zarr scales to export, e.g. [0, 1, 2]; null: all
  description: ""            # provenance
  owners: []                 # provenance, e.g. ["name@crick.ac.uk"]

upload:
  enabled: false             # run_pipeline.sh: upload after the precomputed export
  source: null               # folder in output_dir to upload; null: the precomputed export
  destination: null          # gs://bucket/prefix (or file:///path)
  credentials: ~/.cloudvolume/secrets/google-secret.json   # service-account key file; never in the repo
  threads: 16                # parallel uploads per task
  retries: 4

movie:                       # fly-through MP4 (python -m pipeline.movie; sbatch slurm/movie.sbatch)
  volume: null               # OME-Zarr in output_dir to film; null: <name>.ome.zarr
  name: null                 # -> output_dir/<name>.mp4; null: <volume stem>_movie
  target: null               # [x, y, z] voxels as neuroglancer shows them: zoomed into; z on screen when the zoom ends
  size: [1920, 1080]         # frame width, height; [3840, 2160] for 4K
  view_rotation_deg: 0       # rotates the picture in the frame plane: 0 or 180
  fps: 30
  slices_per_s: 30           # scroll speed through z (full-resolution slices); or [zoomed out, zoomed in], e.g. [120, 60]
  direction: 1               # 1: towards higher z, -1: towards lower z
  hold_start_s: 2.0          # on the whole slice before the zoom
  zoom_s: 14.0               # the zoom
  hold_end_s: 4.0            # at the final zoom after it
  rotate_deg: 0              # then turn the cutting plane about the frame's vertical axis (90: to the y-z plane)
  rotate_s: 6.0              # the rotation
  rotated_s: 4.0             # after it
  zoom_out_s: 0.0            # then zoom back out over this long (0: none); rotate_deg 0 or +-90
  zoom_out_to: null          # voxels per frame px at the end; null: the whole final plane (e.g. y by z) fits
  hold_out_s: 3.0            # after the zoom-out
  zoom_start: null           # voxels per frame px at the start; null: the whole slice fits the frame
  zoom_end: 1.0              # voxels per frame px at the end (1: full resolution)
  scale_bar: false
  crf: 18                    # x264 quality: lower is better and bigger
  ffmpeg: ffmpeg
  cache_gb: 4                # decoded chunks kept in memory between frames

slurm:
  mail_user: null            # sbatch --mail-user (failure mails); null: Slurm's default
  preview: {array: 20}
  stitch: {array: 10}
  align: {array: 20}
  overlaps: {array: 20}
  zcorrect: {array: 10}
  render_init: {mem: 16G}    # render.sbatch's 160G is sized for render run
  render: {array: 20}
  pyramid: {array: 10}
