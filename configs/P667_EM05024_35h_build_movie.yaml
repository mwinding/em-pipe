# Talk movie (Oct 2026), the acquisition: the 35h volume built up slice by slice in 3D, in acquisition
# order, from the fly-through's first slice (a close-up where single 8 nm slices show, pulling back as
# the imaging speeds up to thousands of slices a second), the camera orbiting round to face the first
# slice, then the fly-through of P667_EM05024_35h_movie.yaml (the same zoom into the neuropil spot,
# without the turn and the zoom-out).
#   sbatch --output=<output_dir>/work/logs/em-movie-build-%j.out slurm/movie_build.sbatch configs/P667_EM05024_35h_build_movie.yaml
# -> <output_dir>/P667_EM05024_35h_build_movie.mp4
base: P667_EM05024_35h_movie.yaml

movie:
  name: P667_EM05024_35h_build_movie
  rotate_deg: 0                # no turn ...
  zoom_out_s: 0.0              # ... and no zoom-out at the end

build:
  z_far: null                  # slices 8006-12463 (36 um): up to where the 2x2-tile footprint shrinks
