# P667 EM05024 35h, 1-2 October 2026 (1,211 slices) at full resolution (8 nm), with CLAHE (as the 32 nm render).
# Same output_dir as configs/P667_test_2day.yaml: reuses its check, stitch, align and intensity
# results and writes another volume next to the 32 nm one. Only render and pyramid need to run:
#   ./run_pipeline.sh configs/P667_test_2day_8nm_clahe.yaml --steps render,pyramid
name: P667_M10-D01-D02   # -> P667_M10-D01-D02.ome.zarr and P667_M10-D01-D02_<voxel>nm.tif
raw_dir: /camp/project/proj-efibsem/WindingM/P667_EM05024_35h
output_dir: /camp/lab/windingm/home/users/windinm/em-pipe_P667_test-M10-D01-D02

selection:
  start: '2026-10-01 00:00:00'
  end: '2026-10-02 23:59:59'

check:
  voxel_size_nm: [8, 8, 8]
  known_issues:
    - file: M09_D28_tile0-1.tif
      action: exclude
      note: byte copy of M09_D28_tile1-0.tif
    - file: Approach/M09_D18_tile2-1_part2.tif
      action: exclude
      note: byte copy of M09_D18_tile2-2_part2.tif

# Tile overlap is unknown: search it at 1/4 resolution (8 is the default; ~1% overlaps on noisy
# tiles can need more). Failed slices are retried at higher resolution anyway.
stitch:
  coarse_factor: 4

# No curtaining removal: destreak (sigma 4) added bright lines ~500 px inside tile edges and smeared
# strong raw lines, worse for tracing than the mild (~2 grey level) curtaining it removed.
destreak:
  enabled: false

render:
  name: P667_M10-D01-D02_8nm_clahe.ome.zarr
  downsample: 1              # full resolution (8 nm); the pyramid adds 16, 32, 64 nm ...
  clahe:
    enabled: true

slurm:
  mail_user: null            # your email, for failure mails
  render_init: {cpus: 2, mem: 8G, time: "00:30:00"}
  # 1,211 planes = 19 slabs of 64; planes ~700 Mpx: ~45 GB slab buffer + ~35 GB rendering
  render: {array: 19, cpus: 8, mem: 160G, time: "06:00:00"}      # one slab per task
  pyramid: {array: 20, cpus: 2, mem: 8G, time: "02:00:00"}       # s1 is ~1,800 shards
