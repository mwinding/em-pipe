# Video 4 in 4K: P667_EM05024_35h_tissue_zoom_movie_1080p.yaml at twice the resolution, the same movie (framing,
# timing, camera; tests/test_movie_tissue.py::test_twice_the_frame_size_is_the_same_movie): zooms in voxels per
# frame px halved, so the deepest is 0.5 (s0 upsampled 2x); the 3D parts stay on s5. Its own scene and mask, as
# the 1080p job's.
#   sbatch --output=<output_dir>/work/logs/em-movie-tissue-%j.out slurm/movie_tissue.sbatch configs/P667_EM05024_35h_tissue_zoom_movie_4k.yaml
# -> <output_dir>/P667_EM05024_35h_tissue_zoom_movie_4k.mp4 (3840x2160, 40.1 s)
base: P667_EM05024_35h_tissue_zoom_movie_1080p.yaml

movie:
  size: [3840, 2160]
  zoom_end: 0.5                  # the 1080p movie's 1 voxel/px

tissue_movie:
  name: P667_EM05024_35h_tissue_zoom_movie_4k
  size: [3840, 2160]
