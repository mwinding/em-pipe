# Fly-through movie for a talk (Oct 2026), from the 2-day test's 8 nm CLAHE volume while the final 35h
# render runs: the whole slice, then a zoom into the left neuropil, scrolling 120 -> 60 slices/s.
#   sbatch --output=/camp/lab/windingm/home/users/windinm/em-pipe_P667_test-M10-D01-D02/work/logs/em-movie-%j.out \
#       slurm/movie.sbatch configs/P667_test_2day_movie.yaml
# -> em-pipe_P667_test-M10-D01-D02/P667_M10-D01-D02_8nm_clahe_movie.mp4
base: P667_test_2day.yaml

movie:
  volume: P667_M10-D01-D02_8nm_clahe.ome.zarr
  view_rotation_deg: 180
  target: [8640, 13840, 1010] # x, y, z voxels: neuropil right of the lumen once rotated; z 1010 on screen when the zoom ends
  slices_per_s: [120, 60]    # zoomed out -> zoomed in
  # 13.5 s: the most this volume's 1,211 slices allow at these speeds
  hold_start_s: 1.5
  zoom_s: 9.0
  hold_end_s: 3.0
