# Variant of P667_EM05024_35h_tissue_zoom_movie.yaml ("just to see", Oct 2026): seen from the opposite
# side, the anterior (+z, last-slice) end, the stack growing in the order it was imaged (z = 0 first, each
# new slice on the face towards the camera), then one continuous turn round to the z = 0 side, the resin
# fading from 1.5 s after the slicing stops, and the same cut, tissue-only zoom and ending
# (video 1's view: not mirrored, same scroll direction).
#   python -m pipeline.movie_tissue --config configs/P667_EM05024_35h_tissue_zoom_movie_opposite.yaml frames --workers 8
base: P667_EM05024_35h_tissue_zoom_movie.yaml

tissue_movie:
  name: P667_EM05024_35h_tissue_zoom_movie_opposite
  build_order: imaging
  yaw_deg: [-120, 0]           # three quarters from the +z end (and the -x side, as the main version), round
                               # through the side view to the front, z = 0
  turn_s: 9.0                  # twice the main version's angle: a longer turn
  fade_start_s: 1.0            # the resin fades from 1 s after the slicing stops
